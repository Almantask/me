<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="canonical" href="https://almantask.github.io/me/" />

    <!-- Both languages are the same document, selected by ?lang=. x-default points at
         the bare URL, which resolves from the reader's own browser preference. -->
    <link rel="alternate" hreflang="en" href="https://almantask.github.io/me/?lang=en" />
    <link rel="alternate" hreflang="lt" href="https://almantask.github.io/me/?lang=lt" />
    <link rel="alternate" hreflang="x-default" href="https://almantask.github.io/me/" />

    <title>Almantas Karpavičius — Engineering Manager, author, mentor</title>
    <meta
      name="description"
      content="Engineering Manager at Nord Security. 3× Microsoft MVP, author of two books, conference speaker, and mentor at Idealogue, KTU and Nord Security."
    />
    <meta name="author" content="Almantas Karpavičius" />
    <meta name="theme-color" content="#100E0D" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAF8F5" media="(prefers-color-scheme: light)" />

    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Almantas Karpavičius" />
    <meta property="og:title" content="Almantas Karpavičius — Engineering Manager, author, mentor" />
    <meta
      property="og:description"
      content="I like coding. I like growing people a lot more. Engineering Manager at Nord Security, 3× Microsoft MVP, author of two books."
    />
    <meta property="og:url" content="https://almantask.github.io/me/" />
    <meta property="og:image" content="https://almantask.github.io/me/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Almantas Karpavičius speaking on stage" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- React writes these from the content bundle, but only once it has hydrated, so a
         Lithuanian reader would watch the English title for a beat first. This applies the
         same strings before first paint, by the same precedence as resolveLanguage:
         ?lang= beats a stored choice beats the browser's own preference.
         src/__tests__/head.test.ts fails the build if they drift from src/content. -->
    <script>
      ;(function () {
        var M = {
          en: {
            t: 'Almantas Karpavičius — Engineering Manager, author, mentor',
            d: 'Engineering Manager at Nord Security. 3× Microsoft MVP, author of two books, conference speaker, and mentor at Idealogue, KTU and Nord Security.',
            o: 'I like coding. I like growing people a lot more. Engineering Manager at Nord Security, 3× Microsoft MVP, author of two books.',
          },
          lt: {
            t: 'Almantas Karpavičius — Programavimo Komandos Vadovas, autorius, mentorius',
            d: 'Programavimo Komandos Vadovas Nord Security. 3× Microsoft MVP, dviejų knygų autorius, konferencijų pranešėjas ir mentorius Idealogue, KTU bei Nord Security.',
            o: 'Man patinka programuoti. Ugdyti žmones patinka dar labiau. Programavimo Komandos Vadovas Nord Security, 3× Microsoft MVP, dviejų knygų autorius.',
          },
        }
        function pick() {
          var p = null
          try {
            p = new URLSearchParams(location.search).get('lang')
          } catch (e) {}
          if (p && M[p]) return p
          try {
            var stored = localStorage.getItem('akarpavicius-language')
            if (stored && M[stored]) return stored
          } catch (e) {}
          var tags = navigator.languages || [navigator.language || '']
          for (var i = 0; i < tags.length; i++) {
            var primary = String(tags[i]).toLowerCase().split('-')[0]
            if (M[primary]) return primary
          }
          return 'en'
        }
        var lang = pick()
        var meta = M[lang]
        document.documentElement.lang = lang
        document.title = meta.t
        function set(attr, key, value) {
          var el = document.querySelector('meta[' + attr + '="' + key + '"]')
          if (el) el.setAttribute('content', value)
        }
        set('name', 'description', meta.d)
        set('property', 'og:title', meta.t)
        set('property', 'og:description', meta.o)
      })()
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Almantas Karpavičius",
        "url": "https://almantask.github.io/me/",
        "image": "https://almantask.github.io/me/og.jpg",
        "jobTitle": "Engineering Manager",
        "email": "mailto:almantusk@gmail.com",
        "address": { "@type": "PostalAddress", "addressLocality": "Kaunas", "addressCountry": "LT" },
        "worksFor": { "@type": "Organization", "name": "Nord Security" },
        "alumniOf": { "@type": "CollegeOrUniversity", "name": "Kaunas University of Technology" },
        "knowsAbout": ["Engineering management", "Mentoring", "Behaviour-driven development", "C#", "AI-assisted software development"],
        "sameAs": [
          "https://www.linkedin.com/in/almantas-karpavicius",
          "https://github.com/Almantask",
          "https://www.youtube.com/c/AlmantasKarpavi%C4%8Dius",
          "https://mvp.microsoft.com/en-us/PublicProfile/5004259",
          "https://www.amazon.com/Software-Craftsmanship-Using-Practical-reviewing/dp/9365892422",
          "https://www.amazon.com/Workshop-Kickstart-career-software-developer/dp/1800566492"
        ]
      }
    </script>

    <script>
      // Applies the theme before first paint. Without this the page flashes the wrong
      // background on every load. Mirrors resolveTheme() in src/hooks/useTheme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('akarpavicius-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

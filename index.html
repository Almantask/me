    <script>
      // Applies the theme before first paint. Without this the page flashes the wrong
      // background on every load. Mirrors resolveTheme() in src/hooks/useTheme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('akarpavicius-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
